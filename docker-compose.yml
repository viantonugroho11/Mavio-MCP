services:
  postgres:
    image: postgres:16-alpine
    container_name: mavio-postgres
    environment:
      POSTGRES_USER: mavio
      POSTGRES_PASSWORD: mavio
      POSTGRES_DB: mavio
    ports:
      - "5432:5432"
    volumes:
      - mavio-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mavio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mavio-pg-data:
