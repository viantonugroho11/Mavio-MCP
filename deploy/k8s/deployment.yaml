apiVersion: apps/v1
kind: Deployment
metadata:
  name: mavio-mcp
  labels: { app.kubernetes.io/name: mavio-mcp }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: mavio-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mavio-mcp }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: server
          image: ghcr.io/viantonugroho11/mavio-mcp-server:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: MAVIO_HTTP_PORT, value: "4000" }
            - { name: MAVIO_CONFIG,    value: /etc/mavio/mavio.config.yaml }
            - name: MAVIO_DB_URL
              valueFrom: { secretKeyRef: { name: mavio-secrets, key: MAVIO_DB_URL } }
            - name: MAVIO_REDIS_URL
              valueFrom: { secretKeyRef: { name: mavio-secrets, key: MAVIO_REDIS_URL } }
            - name: MAVIO_ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: mavio-secrets, key: MAVIO_ADMIN_API_KEY } }
          volumeMounts:
            - { name: config, mountPath: /etc/mavio, readOnly: true }
            - { name: tmp,    mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /metrics, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: mavio-mcp-config }
        - name: tmp
          emptyDir: {}
