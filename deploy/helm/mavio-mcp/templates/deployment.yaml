apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mavio-mcp.fullname" . }}
  labels: {{- include "mavio-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "mavio-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mavio-mcp.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mavio-mcp.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: MAVIO_CONFIG
              value: /etc/mavio/mavio.config.yaml
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.secretEnv }}
            {{- range $key, $_ := .Values.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mavio-mcp.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mavio
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe: {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mavio-mcp.fullname" . }}-config
        - name: tmp
          emptyDir: {}
