image:
  repository: ghcr.io/viantonugroho11/mavio-mcp-server
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false
  className: nginx
  host: mavio.example.com
  tls: []
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  MAVIO_HTTP_PORT: "4000"
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

secretEnv: {}
  # MAVIO_DB_URL: "postgres://user:pass@host:5432/mavio"
  # MAVIO_REDIS_URL: "redis://redis:6379"
  # MAVIO_SESSION_SECRET: "change-me"
  # MAVIO_ADMIN_API_KEY: "change-me"

config:
  # Full mavio.config.yaml (mounted read-only)
  yaml: |
    version: 1
    mavio:
      dataDir: /data
    database:
      url: ${MAVIO_DB_URL}
    cache:
      url: ${MAVIO_REDIS_URL}
    auth:
      providers:
        - { type: apiKey, id: default }
    workspaces:
      - id: default
        name: Default
        projects:
          - { id: sandbox, name: Sandbox }
    servers: []
    router:
      endpoint: /mcp
      rateLimit: { rpm: 600, burst: 60 }
      circuitBreaker:
        failureThreshold: 5
        resetMs: 30000
        halfOpenMaxCalls: 1

serviceAccount:
  create: true
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: "/metrics"

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

livenessProbe:
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
